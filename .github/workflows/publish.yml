name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "$NUGET_USER" ]; then
            echo "::error::Missing repository secret NUGET_USER (nuget.org profile name, not email)."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Test
        run: |
          dotnet test src/dotnet/DataGrid.slnx -c Release
          npm ci
          npm run lint:frontend
          npm run test:npm

      - name: Pack
        run: |
          dotnet pack src/dotnet/DataGrid.slnx -c Release -o artifacts/nuget
          npm run pack:npm

      - name: NuGet login (OIDC → nuget.org)
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish NuGet to nuget.org
        run: |
          dotnet nuget push artifacts/nuget/*.nupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Publish NuGet symbols to nuget.org
        continue-on-error: true
        run: |
          dotnet nuget push artifacts/nuget/*.snupkg \
            --source https://api.nuget.org/v3/index.json \
            --api-key ${{ steps.nuget_login.outputs.NUGET_API_KEY }} \
            --skip-duplicate

      - name: Publish NuGet to GitHub Packages
        run: |
          dotnet nuget add source \
            --username ${{ github.actor }} \
            --password ${{ secrets.GITHUB_TOKEN }} \
            --store-password-in-clear-text \
            --name github \
            "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json"
          dotnet nuget push artifacts/nuget/*.nupkg --source github --skip-duplicate
          dotnet nuget push artifacts/nuget/*.snupkg --source github --skip-duplicate

      - name: Publish npm to npmjs.com
        run: |
          npm install -g npm@latest
          NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc"
          OIDC_TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value')
          printf "registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n" "$OIDC_TOKEN" > "$NPM_CONFIG_USERCONFIG"
          export NPM_CONFIG_USERCONFIG
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG=preview
          else
            NPM_TAG=latest
          fi
          npm publish "artifacts/npm/laczynski-datagrid-${VERSION}.tgz" --access public --tag "$NPM_TAG" --provenance
          npm publish "artifacts/npm/laczynski-datagrid-primeng-${VERSION}.tgz" --access public --tag "$NPM_TAG" --provenance
          npm publish "artifacts/npm/laczynski-datagrid-ui-${VERSION}.tgz" --access public --tag "$NPM_TAG" --provenance
          npm publish "artifacts/npm/laczynski-datagrid-spartan-${VERSION}.tgz" --access public --tag "$NPM_TAG" --provenance
          npm publish "artifacts/npm/laczynski-datagrid-cli-${VERSION}.tgz" --access public --tag "$NPM_TAG" --provenance

      - name: Publish npm to GitHub Packages
        run: |
          NPM_CONFIG_USERCONFIG="${RUNNER_TEMP}/.npmrc-ghp"
          printf "@laczynski:registry=https://npm.pkg.github.com\n//npm.pkg.github.com/:_authToken=%s\n" "${{ secrets.GITHUB_TOKEN }}" > "$NPM_CONFIG_USERCONFIG"
          export NPM_CONFIG_USERCONFIG
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ "$VERSION" == *-* ]]; then
            NPM_TAG=preview
          else
            NPM_TAG=latest
          fi
          npm publish "artifacts/npm/laczynski-datagrid-${VERSION}.tgz" --tag "$NPM_TAG"
          npm publish "artifacts/npm/laczynski-datagrid-primeng-${VERSION}.tgz" --tag "$NPM_TAG"
          npm publish "artifacts/npm/laczynski-datagrid-ui-${VERSION}.tgz" --tag "$NPM_TAG"
          npm publish "artifacts/npm/laczynski-datagrid-spartan-${VERSION}.tgz" --tag "$NPM_TAG"
          npm publish "artifacts/npm/laczynski-datagrid-cli-${VERSION}.tgz" --tag "$NPM_TAG"

      - name: Extract release notes
        run: node scripts/extract-changelog.mjs "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: release-notes.md
