@if (viewsEnabled()) {
  <div class="dg-grid-views-group">
    <div class="dg-grid-views">
      <dg-sh-select
        class="dg-grid-views__select"
        [items]="presetItems()"
        [size]="size()"
        [ngModel]="selectedPresetId()"
        (selectionChange)="onPresetSelected($event)"
        [placeholder]="viewsPlaceholder()"
      />

      @if (canUpdateSelected()) {
        <dg-sh-btn
          appearance="outline"
          [size]="size()"
          icon="save"
          variant="secondary"
          [ariaLabel]="updateViewLabel()"
          [qgShTooltip]="updateViewLabel()"
          qgShTooltipPosition="top"
          (click)="updatePreset()"
        />
      }

      <dg-sh-btn
        appearance="outline"
        [size]="size()"
        icon="add"
        variant="secondary"
        [ariaLabel]="saveAsViewLabel()"
        [qgShTooltip]="saveAsViewLabel()"
        qgShTooltipPosition="top"
        (click)="openSaveDialog()"
      />

      @if (canDeleteSelected()) {
        <dg-sh-btn
          appearance="outline"
          [size]="size()"
          icon="delete"
          variant="danger"
          [ariaLabel]="deleteViewLabel()"
          [qgShTooltip]="deleteViewLabel()"
          qgShTooltipPosition="top"
          (click)="deleteSelected()"
        />
      }
    </div>

    <span class="dg-grid-views__divider" aria-hidden="true"></span>
  </div>

  <dialog #saveDialog class="dg-grid-views__dialog" (cancel)="closeSaveDialog()">
    <form class="dg-grid-views__dialog-form" (submit)="onSaveSubmit($event)">
      <h3 class="dg-grid-views__dialog-title">{{ saveViewTitle() }}</h3>
      <dg-sh-text
        [size]="size()"
        [ngModel]="newPresetName()"
        (ngModelChange)="newPresetName.set($event)"
        name="viewName"
        [placeholder]="viewNamePlaceholder()"
      />
      <div class="dg-grid-views__dialog-actions">
        <dg-sh-btn
          type="button"
          [size]="size()"
          [text]="cancelLabel()"
          appearance="outline"
          variant="secondary"
          (click)="closeSaveDialog()"
        />
        <dg-sh-btn type="submit" [size]="size()" [text]="saveLabel()" variant="primary" />
      </div>
    </form>
  </dialog>
}
